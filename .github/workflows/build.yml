name: Build FRCS V5 Setup

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PySide6 pandas numpy openpyxl

    - name: Create Python Script
      shell: cmd
      run: |
        echo import sys > app.py
        echo from PySide6.QtWidgets import QApplication, QMainWindow, QLabel, QVBoxLayout, QWidget, QPushButton, QMessageBox >> app.py
        echo class MainWindow(QMainWindow): >> app.py
        echo     def __init__(self): >> app.py
        echo         super().__init__() >> app.py
        echo         self.setWindowTitle('FRCS V5 - Financial Advisory Platform') >> app.py
        echo         self.resize(800, 500) >> app.py
        echo         widget = QWidget() >> app.py
        echo         layout = QVBoxLayout(widget) >> app.py
        echo         lbl = QLabel('FRCS V5 Engine System Ready') >> app.py
        echo         btn = QPushButton('Run Analysis') >> app.py
        echo         btn.clicked.connect(lambda: QMessageBox.information(self, 'FRCS V5', 'System Operating Normally')) >> app.py
        echo         layout.addWidget(lbl) >> app.py
        echo         layout.addWidget(btn) >> app.py
        echo         self.setCentralWidget(widget) >> app.py
        echo app = QApplication(sys.argv) >> app.py
        echo win = MainWindow() >> app.py
        echo win.show() >> app.py
        echo sys.exit(app.exec()) >> app.py

    - name: Build Executable
      run: |
        pyinstaller --noconfirm --onefile --name "FRCS_V5_Full_App" app.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FRCS_V5_Full_Executable
        path: dist/FRCS_V5_Full_App.exe
