name: Build FRCS V5 Setup

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PySide6 fastapi uvicorn requests

    - name: Setup Project Structure
      run: |
        python gemini-code-1791027611282.py

    - name: Generate Main GUI File
      run: |
        python -c "
        import os
        os.makedirs('desktop', exist_ok=True)
        code = '''import sys
        from PySide6.QtWidgets import (QApplication, QMainWindow, QLabel, QVBoxLayout, QWidget, 
                                       QPushButton, QHBoxLayout, QFrame, QDialog, QFormLayout, 
                                       QLineEdit, QMessageBox, QGroupBox, QScrollArea)
        from PySide6.QtCore import Qt

        class FinancialDataDialog(QDialog):
            def __init__(self, parent=None):
                super().__init__(parent)
                self.setWindowTitle('إدخال البيانات والقوائم المالية - FRCS V5')
                self.resize(550, 600)
                self.setLayout(QVBoxLayout())

                scroll = QScrollArea()
                scroll.setWidgetResizable(True)
                content = QWidget()
                form_layout = QVBoxLayout(content)

                # Balance Sheet Group
                bs_group = QGroupBox('بيانات الميزانية العمومية')
                bs_layout = QFormLayout(bs_group)
                self.inputs = {}
                fields_bs = [
                    ('total_assets', 'إجمالي الأصول:'),
                    ('current_assets', 'الأصول المتداولة:'),
                    ('total_liabilities', 'إجمالي الالتزامات:'),
                    ('current_liabilities', 'الالتزامات المتداولة:'),
                    ('retained_earnings', 'الأرباح المبقاة:'),
                    ('equity', 'إجمالي حقوق الملكية:')
                ]
                for key, label in fields_bs:
                    inp = QLineEdit()
                    inp.setPlaceholderText('0.00')
                    bs_layout.addRow(label, inp)
                    self.inputs[key] = inp
                form_layout.addWidget(bs_group)

                # Income Statement Group
                is_group = QGroupBox('بيانات قائمة الدخل')
                is_layout = QFormLayout(is_group)
                fields_is = [
                    ('revenue', 'إجمالي المبيعات / الإيرادات:'),
                    ('ebit', 'الأرباح قبل الفوائد والضرائب (EBIT):'),
                    ('net_income', 'صافي الدخل:')
                ]
                for key, label in fields_is:
                    inp = QLineEdit()
                    inp.setPlaceholderText('0.00')
                    is_layout.addRow(label, inp)
                    self.inputs[key] = inp
                form_layout.addWidget(is_group)

                scroll.setWidget(content)
                self.layout().addWidget(scroll)

                # Buttons
                btn_box = QHBoxLayout()
                save_btn = QPushButton('حفظ البيانات والتحليل')
                save_btn.setStyleSheet('background-color: #059669; color: white; padding: 10px; font-weight: bold; border-radius: 5px;')
                save_btn.clicked.connect(self.save_data)
                cancel_btn = QPushButton('إلغاء')
                cancel_btn.setStyleSheet('background-color: #6B7280; color: white; padding: 10px; font-weight: bold; border-radius: 5px;')
                cancel_btn.clicked.connect(self.reject)
                btn_box.addWidget(cancel_btn)
                btn_box.addWidget(save_btn)
                self.layout().addLayout(btn_box)

            def save_data(self):
                QMessageBox.information(self, 'تم الحفظ', 'تم حفظ البيانات المالية بنجاح وهي جاهزة للحسابات والتحليل!')
                self.accept()

        class FRCSMainWindow(QMainWindow):
            def __init__(self):
                super().__init__()
                self.setWindowTitle('Financial Risk & Consulting System - FRCS V5')
                self.resize(800, 500)
                central_widget = QWidget()
                self.setCentralWidget(central_widget)
                main_layout = QVBoxLayout(central_widget)

                header = QFrame()
                header.setStyleSheet('background-color: #1E3A8A; border-radius: 8px; padding: 20px;')
                header_layout = QVBoxLayout(header)
                title_label = QLabel('نظام التحليل المالي والتقييم - FRCS V5')
                title_label.setAlignment(Qt.AlignCenter)
                title_label.setStyleSheet('color: white; font-size: 22px; font-weight: bold;')
                subtitle_label = QLabel('Financial Risk & Consulting System')
                subtitle_label.setAlignment(Qt.AlignCenter)
                subtitle_label.setStyleSheet('color: #93C5FD; font-size: 14px;')
                header_layout.addWidget(title_label)
                header_layout.addWidget(subtitle_label)
                main_layout.addWidget(header)

                content_label = QLabel('جاهز للربط مع المحركات المالية وتصنيفات التقييم')
                content_label.setAlignment(Qt.AlignCenter)
                content_label.setStyleSheet('font-size: 16px; color: #374151; margin-top: 40px;')
                main_layout.addWidget(content_label)

                btn_layout = QHBoxLayout()
                run_btn = QPushButton('بدء التحليل المالي')
                run_btn.setStyleSheet('background-color: #059669; color: white; padding: 12px 24px; font-size: 14px; font-weight: bold; border-radius: 6px;')
                run_btn.clicked.connect(self.open_financial_dialog)
                exit_btn = QPushButton('خروج')
                exit_btn.clicked.connect(self.close)
                exit_btn.setStyleSheet('background-color: #DC2626; color: white; padding: 12px 24px; font-size: 14px; font-weight: bold; border-radius: 6px;')
                btn_layout.addWidget(exit_btn)
                btn_layout.addWidget(run_btn)
                main_layout.addLayout(btn_layout)

            def open_financial_dialog(self):
                dialog = FinancialDataDialog(self)
                dialog.exec()

        if __name__ == '__main__':
            app = QApplication(sys.argv)
            window = FRCSMainWindow()
            window.show()
            sys.exit(app.exec())
        '''
        with open('desktop/main.py', 'w', encoding='utf-8') as f:
            f.write(code)
        "

    - name: Build Single Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "FRCS_V5_App" desktop/main.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FRCS_V5_Setup_Executable
        path: dist/FRCS_V5_App.exe
