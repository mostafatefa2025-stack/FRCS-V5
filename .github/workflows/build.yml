name: Build FRCS V5 Full System Setup

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PySide6 fastapi uvicorn requests pandas numpy jinja2 openpyxl

    - name: Run Main Generator Script
      run: |
        python gemini-code-1791027611282.py

    - name: Build Full FRCS V5 Executable
      run: |
        if (Test-Path "desktop/main.py") {
            pyinstaller --noconfirm --onefile --windowed --name "FRCS_V5_Full_App" desktop/main.py
        } else {
            pyinstaller --noconfirm --onefile --windowed --name "FRCS_V5_Full_App" gemini-code-1791027611282.py
        }

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FRCS_V5_Full_Executable
        path: dist/FRCS_V5_Full_App.exe
