name: Build FRCS V5 Setup

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PySide6 pandas numpy openpyxl

    - name: Generate Multi-Year FRCS V5 Code
      run: |
        python -c "
        import os
        os.makedirs('desktop', exist_ok=True)
        code = '''import sys
        import traceback

        def show_error_and_exit(exc_type, exc_value, exc_tb):
            error_msg = ''.join(traceback.format_exception(exc_type, exc_value, exc_tb))
            try:
                from PySide6.QtWidgets import QApplication, QMessageBox
                app = QApplication.instance() or QApplication(sys.argv)
                QMessageBox.critical(None, 'FRCS V5 Startup Error', f'Runtime Error:\\n\\n{error_msg}')
            except Exception:
                print(error_msg)
            sys.exit(1)

        sys.excepthook = show_error_and_exit

        from PySide6.QtWidgets import (
            QApplication, QMainWindow, QLabel, QVBoxLayout, QWidget, 
            QPushButton, QHBoxLayout, QFrame, QDialog, QFormLayout, 
            QLineEdit, QMessageBox, QGroupBox, QScrollArea, QTabWidget,
            QComboBox, QGridLayout, QTableWidget, QTableWidgetItem, QHeaderView
        )
        from PySide6.QtCore import Qt

        class MultiYearFinancialDialog(QDialog):
            def __init__(self, parent=None):
                super().__init__(parent)
                self.setWindowTitle('FRCS V5 - Multi-Year Financial Analysis & Stress Testing')
                self.resize(900, 750)
                layout = QVBoxLayout(self)

                # Sector & Scenario Setup
                setup_group = QGroupBox('1. Corporate Parameters & Stress Testing Scenario')
                setup_grid = QGridLayout(setup_group)
                
                self.sector_combo = QComboBox()
                self.sector_combo.addItems([
                    'Manufacturing & Industrial', 
                    'Real Estate & Construction', 
                    'Retail & Wholesale', 
                    'Commercial Services', 
                    'Healthcare & Pharma'
                ])
                
                self.scenario_combo = QComboBox()
                self.scenario_combo.addItems([
                    'Base Case (Standard)',
                    'Revenue Shock (-15%)',
                    'Interest Rate Hike (+300 bps)',
                    'Combined Severe Stress (-25% Sales, +10% COGS)'
                ])

                self.wacc_input = QLineEdit('0.10')
                self.tax_input = QLineEdit('0.225')

                setup_grid.addWidget(QLabel('Industry Sector:'), 0, 0)
                setup_grid.addWidget(self.sector_combo, 0, 1)
                setup_grid.addWidget(QLabel('Stress Scenario:'), 0, 2)
                setup_grid.addWidget(self.scenario_combo, 0, 3)
                setup_grid.addWidget(QLabel('WACC (%):'), 1, 0)
                setup_grid.addWidget(self.wacc_input, 1, 1)
                setup_grid.addWidget(QLabel('Tax Rate:'), 1, 2)
                setup_grid.addWidget(self.tax_input, 1, 3)

                layout.addWidget(setup_group)

                # Multi-Year Tabs
                tabs = QTabWidget()
                
                # Helper to create 2-Year Table
                def create_year_table(items):
                    table = QTableWidget(len(items), 2)
                    table.setHorizontalHeaderLabels(['Current Year (T)', 'Prior Year (T-1)'])
                    table.setVerticalHeaderLabels([item[1] for item in items])
                    table.horizontalHeader().setSectionResizeMode(QHeaderView.Stretch)
                    for row in range(len(items)):
                        table.setItem(row, 0, QTableWidgetItem('0.00'))
                        table.setItem(row, 1, QTableWidgetItem('0.00'))
                    return table

                # Balance Sheet
                self.bs_fields = [
                    ('cash', 'Cash & Cash Equivalents'),
                    ('receivables', 'Accounts Receivable'),
                    ('inventory', 'Inventory'),
                    ('total_ca', 'Total Current Assets'),
                    ('ppe', 'Net PPE'),
                    ('total_assets', 'TOTAL ASSETS'),
                    ('st_debt', 'Short-Term Debt'),
                    ('total_cl', 'Total Current Liabilities'),
                    ('lt_debt', 'Long-Term Debt'),
                    ('total_liabilities', 'TOTAL LIABILITIES'),
                    ('retained_earnings', 'Retained Earnings'),
                    ('total_equity', 'TOTAL SHAREHOLDERS EQUITY')
                ]
                self.bs_table = create_year_table(self.bs_fields)
                tabs.addTab(self.bs_table, 'Balance Sheet (2 Years)')

                # Income Statement
                self.is_fields = [
                    ('revenue', 'Total Revenues'),
                    ('cogs', 'Cost of Goods Sold (COGS)'),
                    ('ebit', 'Operating Income (EBIT)'),
                    ('interest_exp', 'Interest Expense'),
                    ('net_income', 'NET INCOME')
                ]
                self.is_table = create_year_table(self.is_fields)
                tabs.addTab(self.is_table, 'Income Statement (2 Years)')

                # Cash Flow
                self.cf_fields = [
                    ('ocf', 'Operating Cash Flow (OCF)'),
                    ('capex', 'CAPEX'),
                    ('fcff', 'Free Cash Flow (FCFF)')
                ]
                self.cf_table = create_year_table(self.cf_fields)
                tabs.addTab(self.cf_table, 'Cash Flow (2 Years)')

                layout.addWidget(tabs)

                btn_box = QHBoxLayout()
                run_btn = QPushButton('Execute Multi-Year Analysis & Stress Test')
                run_btn.setStyleSheet('background-color: #059669; color: white; padding: 12px; font-weight: bold; border-radius: 6px;')
                run_btn.clicked.connect(self.run_engine)
                btn_box.addWidget(run_btn)
                layout.addLayout(btn_box)

            def get_cell_val(self, table, row, col):
                try:
                    item = table.item(row, col)
                    return float(item.text()) if item else 0.0
                except ValueError:
                    return 0.0

            def run_engine(self):
                # Extract Assets T & T-1
                assets_t = self.get_cell_val(self.bs_table, 5, 0)
                assets_t1 = self.get_cell_val(self.bs_table, 5, 1)
                
                rev_t = self.get_cell_val(self.is_table, 0, 0)
                rev_t1 = self.get_cell_val(self.is_table, 0, 1)

                ebit_t = self.get_cell_val(self.is_table, 2, 0)
                net_inc_t = self.get_cell_val(self.is_table, 4, 0)
                net_inc_t1 = self.get_cell_val(self.is_table, 4, 1)

                liab_t = self.get_cell_val(self.bs_table, 9, 0)
                equity_t = self.get_cell_val(self.bs_table, 11, 0)
                re_t = self.get_cell_val(self.bs_table, 10, 0)

                ca_t = self.get_cell_val(self.bs_table, 3, 0)
                cl_t = self.get_cell_val(self.bs_table, 7, 0)
                wc_t = ca_t - cl_t

                # Apply Stress Test Multipliers
                scenario = self.scenario_combo.currentText()
                stress_factor = 1.0
                if 'Revenue Shock' in scenario:
                    rev_t *= 0.85
                    ebit_t *= 0.80
                elif 'Combined Severe' in scenario:
                    rev_t *= 0.75
                    ebit_t *= 0.65

                # Calculations
                z_score = 0.0
                if assets_t > 0:
                    x1 = wc_t / assets_t
                    x2 = re_t / assets_t
                    x3 = ebit_t / assets_t
                    x4 = equity_t / liab_t if liab_t > 0 else 1.0
                    x5 = rev_t / assets_t
                    z_score = round(1.2 * x1 + 1.4 * x2 + 3.3 * x3 + 0.6 * x4 + 0.999 * x5, 2)

                # Piotroski F-Score (Trend Comparison)
                f_score = 0
                if net_inc_t > 0: f_score += 1
                if (net_inc_t - net_inc_t1) > 0: f_score += 1
                if (rev_t - rev_t1) > 0: f_score += 1
                if wc_t > 0: f_score += 1

                roa_t = (net_inc_t / assets_t) if assets_t > 0 else 0
                roa_t1 = (net_inc_t1 / assets_t1) if assets_t1 > 0 else 0
                if roa_t > roa_t1: f_score += 1

                res_msg = (
                    f'<b>Scenario Executed:</b> {scenario}<br><br>'
                    f'<b>Altman Z-Score (T):</b> {z_score}<br>'
                    f'<b>Piotroski F-Score (Trend T vs T-1):</b> {f_score} / 9<br>'
                    f'<b>Revenue Growth (T vs T-1):</b> {((rev_t - rev_t1) / rev_t1):.2% if rev_t1 > 0 else 0.0%}<br>'
                    f'<b>ROA Trend:</b> Current {roa_t:.2%} vs Prior {roa_t1:.2%}'
                )
                
                QMessageBox.information(self, 'Multi-Year Analysis Results', res_msg)

        class FRCSMainWindow(QMainWindow):
            def __init__(self):
                super().__init__()
                self.setWindowTitle('Financial Risk & Consulting System - FRCS V5')
                self.resize(900, 600)
                central = QWidget()
                self.setCentralWidget(central)
                layout = QVBoxLayout(central)

                header = QFrame()
                header.setStyleSheet('background-color: #1E3A8A; border-radius: 8px; padding: 25px;')
                h_layout = QVBoxLayout(header)
                title = QLabel('FRCS V5 - Master Financial Advisory Platform')
                title.setAlignment(Qt.AlignCenter)
                title.setStyleSheet('color: white; font-size: 24px; font-weight: bold;')
                sub = QLabel('Multi-Year Financial Statement Analysis & Scenario Stress Testing')
                sub.setAlignment(Qt.AlignCenter)
                sub.setStyleSheet('color: #93C5FD; font-size: 15px;')
                h_layout.addWidget(title)
                h_layout.addWidget(sub)
                layout.addWidget(header)

                desc = QLabel('Enter Year T and Year T-1 raw financial statements to enable horizontal comparative models & scenario testing.')
                desc.setAlignment(Qt.AlignCenter)
                desc.setStyleSheet('font-size: 15px; color: #374151; margin-top: 40px;')
                layout.addWidget(desc)

                btn_box = QHBoxLayout()
                btn_start = QPushButton('Open Multi-Year Financial Inputs & Stress Engine')
                btn_start.setStyleSheet('background-color: #059669; color: white; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 6px;')
                btn_start.clicked.connect(self.open_dialog)

                btn_exit = QPushButton('Exit')
                btn_exit.setStyleSheet('background-color: #DC2626; color: white; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 6px;')
                btn_exit.clicked.connect(self.close)

                btn_box.addWidget(btn_exit)
                btn_box.addWidget(btn_start)
                layout.addLayout(btn_box)

            def open_dialog(self):
                d = MultiYearFinancialDialog(self)
                d.exec()

        if __name__ == '__main__':
            app = QApplication(sys.argv)
            win = FRCSMainWindow()
            win.show()
            sys.exit(app.exec())
        '''
        with open('desktop/main.py', 'w', encoding='utf-8') as f:
            f.write(code)
        "

    - name: Build Executable
      run: |
        pyinstaller --noconfirm --onefile --name "FRCS_V5_Full_App" desktop/main.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FRCS_V5_Full_Executable
        path: dist/FRCS_V5_Full_App.exe
