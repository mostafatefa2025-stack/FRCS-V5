name: Build FRCS V5 Setup

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PySide6 fastapi uvicorn requests

    - name: Setup Project Structure
      run: |
        python gemini-code-1791027611282.py

    - name: Create Main Entry File
      run: |
        python -c "import os; os.makedirs('desktop', exist_ok=True); open('desktop/main.py', 'w', encoding='utf-8').write('''import sys\nfrom PySide6.QtWidgets import QApplication, QMainWindow, QLabel, QVBoxLayout, QWidget, QPushButton\nfrom PySide6.QtCore import Qt\n\nclass MainWindow(QMainWindow):\n    def __init__(self):\n        super().__init__()\n        self.setWindowTitle(\"Financial Risk & Consulting System - FRCS V5\")\n        self.resize(600, 400)\n        central_widget = QWidget()\n        self.setCentralWidget(central_widget)\n        layout = QVBoxLayout(central_widget)\n        label = QLabel(\"أهلاً بك في نظام FRCS V5 للتحليل المالي والتقييم\")\n        label.setAlignment(Qt.AlignCenter)\n        label.setStyleSheet(\"font-size: 18px; font-weight: bold; color: #1E3A8A;\")\n        layout.addWidget(label)\n        sub_label = QLabel(\"الواجهة البرمجية تعمل بنجاح!\")\n        sub_label.setAlignment(Qt.AlignCenter)\n        sub_label.setStyleSheet(\"font-size: 14px; color: #059669;\")\n        layout.addWidget(sub_label)\n        btn = QPushButton(\"إغلاق التطبيق\")\n        btn.clicked.connect(self.close)\n        btn.setStyleSheet(\"padding: 10px; font-size: 14px; background-color: #DC2626; color: white; border-radius: 5px;\")\n        layout.addWidget(btn)\n\nif __name__ == \"__main__\":\n    app = QApplication(sys.argv)\n    window = MainWindow()\n    window.show()\n    sys.exit(app.exec())\n''')"

    - name: Build Single Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "FRCS_V5_App" desktop/main.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FRCS_V5_Setup_Executable
        path: dist/FRCS_V5_App.exe
